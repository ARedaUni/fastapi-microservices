apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: users.minikube
      http:
        paths:
          # /api, not /: the whole public surface is mounted below it, so
          # anything else the app serves is unroutable from outside.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 80
          # The one thing users mounts outside /api. In-cluster verifiers reach
          # it via the Service directly; this is so it can be curled from
          # outside, which is most of how a key problem gets diagnosed.
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 80
    # A second host rather than a second path prefix: both services mount their
    # whole surface under /api, so they cannot share one hostname without a
    # rewrite neither app expects.
    - host: canvas.minikube
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: canvas-service
                port:
                  number: 80
