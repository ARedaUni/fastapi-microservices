apiVersion: v1
kind: Service
metadata:
  name: users-service
  labels:
    app: users
spec:
  # ClusterIP, not NodePort: the Ingress reaches this from inside the cluster,
  # and Tilt's port_forwards goes to the pod. A node port would publish the
  # service on every node's IP for nobody's benefit.
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
  selector:
    app: users
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: users-configuration
  labels:
    app: users
data:
  ACCESS_TOKEN_EXPIRE_MINUTES: "10"
  PROJECT_NAME: "Users Microservice"
  # In-cluster name, matching canvas' JWT_ISSUER exactly -- it is compared as a
  # string, not resolved.
  JWT_ISSUER: "http://users-service"
  # This service's own database. One per service, never shared -- two Alembic
  # histories in one database fight over `alembic_version`.
  POSTGRES_DB: "users"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-credentials
type: Opaque
# Example values, checked in and therefore public. Replace all three before
# this is deployed anywhere real. jwt_private_key is the RSA key users signs
# with; it never leaves this service. Regenerate:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
#     | base64 | tr -d '\n' | base64
data:
  email: YWRtaW5AYWRtaW4uY29t
  password: cGFzc3dvcmQ=
  jwt_private_key: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: wait-database
          image: postgres:12
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h ${POSTGRES_HOST};  do echo waiting for database; sleep 2; done;",
            ]
          env:
            - name: POSTGRES_HOST
              value: "postgres-service"
        # Schema *and* seed. The seed used to run from the archived base
        # image's PRE_START_PATH hook; it needs the full app env because
        # app.core.config validates every setting at import.
        - name: perform-migrations
          image: users
          command:
            ["sh", "-c", "alembic upgrade head && python scripts/initial_data.py"]
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: FIRST_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: email
            - name: FIRST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: jwt_private_key
          envFrom:
            - configMapRef:
                name: postgres-configuration
            - configMapRef:
                name: users-configuration
      containers:
        - name: users
          image: users
          ports:
            - containerPort: 80
          livenessProbe:
            initialDelaySeconds: 3
            periodSeconds: 5
            httpGet:
              path: /api/health/
              port: 80
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: FIRST_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: email
            - name: FIRST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: users-credentials
                  key: jwt_private_key
          envFrom:
            - configMapRef:
                name: postgres-configuration
            - configMapRef:
                name: users-configuration
