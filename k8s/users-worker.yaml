apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-worker-deployment
  labels:
    app: users-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-worker
  template:
    metadata:
      labels:
        app: users-worker
    spec:
      containers:
        - name: users-worker
          image: users-worker
          # Two variables, not the app's nine, and now by design: the worker
          # imports app.core.redis.RedisConfig, which validates only these.
          # Importing app.core.config here would crash on the missing database
          # and secret key.
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
