# Local dev loop. The k8s/Tilt setup stays the source of truth for deployment;
# this exists so you can run and test the service without a cluster.
services:
  postgres:
    image: postgres:12
    environment:
      # The server's own bootstrap database, not any service's. Every service
      # database is created by scripts/init-databases.sql. Left at `postgres`
      # the entrypoint creates nothing extra, so there is no stray database
      # that looks like it might be shared.
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports: ["55432:5432"]  # avoid clashing with a local postgres
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # -h localhost forces TCP. During initdb the entrypoint runs a temporary
      # server on the unix socket only, so a socket check goes green before the
      # init scripts have created `users` and lets migrate start too early.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "user", "-d", "users"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:alpine
    ports: ["56379:6379"]

  # Runs to completion before the API starts. Owns both schema and seed data --
  # the seed used to be the archived base image's PRE_START_PATH hook.
  migrate:
    build:
      context: users
      target: prod
    command: sh -c "alembic upgrade head && python scripts/initial_data.py"
    env_file: .env
    volumes:
      - ./users/migrations:/app/migrations
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build:
      context: users
      target: dev
    env_file: .env
    ports: ["8000:80"]
    volumes:
      - ./users/app:/app/app
      - ./users/tests:/app/tests
      # Not the api's code -- mounted so `make lint` reaches the locustfile.
      # ruff covers it; mypy doesn't, since locust isn't installed here.
      - ./load:/app/load
      - ./users/migrations:/app/migrations
      - ./users/pyproject.toml:/app/pyproject.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/health/')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}

  worker:
    build:
      context: users
      target: worker
    env_file: .env
    volumes:
      - ./users/app:/app/app
    depends_on:
      redis: {condition: service_started}

  # --- canvas: the second service. Its own database, no shared tables. ---
  #
  # Both canvas services override two variables from the shared .env: the
  # database, because one Alembic history per database is the rule the whole
  # repo is built on, and the title, because it shows up in /api/docs.
  canvas-migrate:
    build:
      context: canvas
      target: prod
    # Schema only -- unlike users/, there is no seed. A canvas starts empty.
    command: alembic upgrade head
    env_file: .env
    environment:
      POSTGRES_DB: canvas
    volumes:
      - ./canvas/migrations:/app/migrations
    depends_on:
      postgres: {condition: service_healthy}

  canvas-api:
    build:
      context: canvas
      target: dev
    env_file: .env
    environment:
      PROJECT_NAME: Canvas Microservice
      POSTGRES_DB: canvas
    ports: ["8001:80"]  # 8000 is users
    volumes:
      - ./canvas/app:/app/app
      - ./canvas/tests:/app/tests
      - ./canvas/migrations:/app/migrations
      - ./canvas/pyproject.toml:/app/pyproject.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/health/')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      canvas-migrate: {condition: service_completed_successfully}
    # No redis dependency: nothing here enqueues a job until stage 2.

  # Load generator. Behind a profile, so `make up` and CI never start it --
  # `docker compose up` skips profiled services unless the profile is named.
  locust:
    image: locustio/locust:2.46.4
    profiles: ["load"]
    env_file: .env  # FIRST_USER_EMAIL / FIRST_USER_PASSWORD, the seeded superuser
    volumes:
      - ./load:/mnt/locust:ro
    ports: ["8089:8089"]
    # `http://api` is port 80 inside the network; 8000 is only the host mapping.
    command: -f /mnt/locust/locustfile.py --host http://api --class-picker ReadUser
    depends_on:
      api: {condition: service_healthy}
