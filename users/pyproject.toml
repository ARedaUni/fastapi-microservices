[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# E/W/F is what flake8 was checking; I replaces isort, and F401 replaces the
# unused-import half of autoflake.
select = ["E", "W", "F", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
