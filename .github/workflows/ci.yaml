name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      # CI runs the same stack `make up` runs locally, so a green pipeline and a
      # working laptop mean the same thing.
      - name: Start the stack
        run: |
          cp .env.example .env
          make up

      - name: Lint
        run: make lint

      - name: Test
        run: make tests

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
