name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      # CI runs the same stack `make up` runs locally, so a green pipeline and a
      # working laptop mean the same thing.
      - name: Start the stack
        run: |
          cp .env.example .env
          make up

      # `make tests` runs the canvas page's model tests with node:test, and the
      # journeys below need Node too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint
        run: make lint

      - name: Test
        run: make tests

      # After `make tests`, because this one needs both services actually
      # answering on the network -- it asserts they agree about what a token is,
      # which neither service's own suite can see.
      - name: Contract
        run: make contract

      # Last and fewest: a real browser on canvas.html against the same stack.
      - name: Browser journeys
        run: |
          npm ci
          npx playwright install --with-deps chromium
          make e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
