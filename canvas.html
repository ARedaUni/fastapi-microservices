<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            color: #333;
            letter-spacing: -0.5px;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .status {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .grid-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .grid-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .grid-container {
            border: 3px solid #e0e0e0;
            background: #fafafa;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(100, 1fr);
            gap: 0;
            width: 800px;
            height: 800px;
        }

        .tile {
            aspect-ratio: 1;
            border: 0.5px solid #e8e8e8;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: #333;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .tile:hover {
            filter: brightness(1.05);
            z-index: 10;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
        }

        .tile.owned {
            cursor: default;
        }

        .tile.owned:hover {
            filter: brightness(0.98);
        }

        .tile.claiming {
            animation: pulse 0.6s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .tile-owner {
            font-size: 8px;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-prompt {
            text-align: center;
            padding: 60px 40px;
        }

        .login-prompt h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 28px;
        }

        .login-prompt p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .login-prompt code {
            background: #f5f5f5;
            padding: 12px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 15px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            color: #333;
            border: 1px solid #e0e0e0;
            overflow-x: auto;
            max-width: 500px;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
            padding: 20px 0;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .stat-dot.claimed {
            background: #667eea;
        }

        .stat-dot.held {
            background: repeating-linear-gradient(45deg, #667eea 0 2px, #fff 2px 4px);
        }

        /* Held: striped and see-through. Yours also breathes, because a click keeps it. */
        .tile.held {
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.7) 0 1px, transparent 1px 3px);
            opacity: 0.6;
        }

        .tile.held.mine {
            cursor: pointer;
            animation: breathe 1.2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        /* Past the deadline but not yet swept: the gap between the two is visible. */
        .tile.lapsed, .tile.held.mine.lapsed {
            filter: grayscale(1);
            opacity: 0.25;
            animation: none;
            cursor: default;
        }

        .tile.confirmed.just {
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(2.2); z-index: 20; }
            100% { transform: scale(1); }
        }

        .holds {
            width: 800px;
            font-size: 13px;
            color: #444;
        }

        .holds h3 {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .hold-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            font-variant-numeric: tabular-nums;
        }

        .hold-row .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .hold-row .time {
            margin-left: auto;
            min-width: 70px;
            text-align: right;
        }

        .hold-row button {
            padding: 4px 12px;
            font-size: 12px;
        }

        .stat-dot.empty {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Canvas</h1>
            <div class="auth-section">
                <span class="user-info" id="userInfo"></span>
                <button id="authButton">Login</button>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div class="main-content">
            <div id="content"></div>
        </div>
    </div>

    <script>
        const USERS_API = "http://localhost:8000";
        const CANVAS_API = "http://localhost:8001";

        let token = null;
        let owner = null;
        let claims = {};
        let isLoading = false;
        let eventSource = null;

        async function init() {
            token = localStorage.getItem("jwt_token");
            owner = localStorage.getItem("jwt_owner");

            const authButton = document.getElementById("authButton");
            const userInfo = document.getElementById("userInfo");

            if (token && owner) {
                userInfo.textContent = `👤 ${owner}`;
                authButton.textContent = "Logout";
                authButton.onclick = logout;
                connectStream();
            } else {
                userInfo.textContent = "";
                authButton.textContent = "Login";
                authButton.onclick = login;
                disconnectStream();
                showLoginPrompt();
            }
        }

        function connectStream() {
            disconnectStream();
            eventSource = new EventSource(`${CANVAS_API}/api/v1/claims/stream`);

            // Fires on the first connect and on every automatic reconnect alike.
            // A reconnect is a plain HTTP request with no memory of what it
            // missed while disconnected, so ground truth comes from a full
            // refetch here; onmessage below only has to carry the live tail.
            eventSource.onopen = () => loadCanvas();

            eventSource.onmessage = (e) => setClaim(JSON.parse(e.data));
            // No onerror handling needed: EventSource retries on its own, and
            // onopen already re-syncs state whenever a retry succeeds.
        }

        function disconnectStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function login() {
            showStatus("Run the setup script: ./setup-canvas-token.sh", "info");
        }

        function logout() {
            localStorage.removeItem("jwt_token");
            localStorage.removeItem("jwt_owner");
            token = null;
            owner = null;
            init();
        }

        function showLoginPrompt() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="login-prompt">
                    <h2>Welcome to Canvas</h2>
                    <p>A collaborative pixel grid where every tile has one owner.</p>
                    <p style="font-size: 13px; margin-top: 30px;">Run this in your terminal to get started:</p>
                    <code>./setup-canvas-token.sh</code>
                    <p style="margin-top: 20px; font-size: 12px; color: #999;">Then follow the instructions to set your token.</p>
                </div>
            `;
        }

        async function loadCanvas() {
            if (isLoading) return;
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="loading">
                    <span class="spinner"></span>Loading canvas...
                </div>
            `;
            isLoading = true;

            try {
                const resp = await fetch(`${CANVAS_API}/api/v1/claims/`, {
                    method: "GET",
                    headers: { "Accept": "application/json" }
                });

                if (!resp.ok) throw new Error(`Failed to load claims: ${resp.status}`);

                // A bare array of claims, not { claims: [...] }.
                const data = await resp.json();
                claims = {};
                data.forEach(claim => {
                    claims[`${claim.x},${claim.y}`] = claim;
                });

                renderGrid();
            } catch (e) {
                showStatus(`Error loading canvas: ${e.message}`, "error");
                content.innerHTML = `<div class="login-prompt"><h2>Error</h2><p>${e.message}</p></div>`;
            } finally {
                isLoading = false;
            }
        }

        function renderGrid() {
            const content = document.getElementById("content");
            const wrapper = document.createElement("div");
            wrapper.className = "grid-wrapper";

            const gridContainer = document.createElement("div");
            gridContainer.className = "grid-container";

            const gridInner = document.createElement("div");
            gridInner.className = "grid";

            for (let y = 0; y < 100; y++) {
                for (let x = 0; x < 100; x++) {
                    const tile = createTile(x, y);
                    gridInner.appendChild(tile);
                }
            }

            gridContainer.appendChild(gridInner);

            const stats = document.createElement("div");
            stats.className = "stats";
            stats.id = "stats";

            const holds = document.createElement("div");
            holds.className = "holds";
            holds.id = "holds";

            wrapper.appendChild(gridContainer);
            wrapper.appendChild(stats);
            wrapper.appendChild(holds);

            content.innerHTML = "";
            content.appendChild(wrapper);
            renderPanels();
        }

        // Browser clock vs Postgres's: fine for a countdown, never for deciding.
        // The server's 409 is the real answer.
        function msLeft(claim) {
            return new Date(claim.expires_at) - Date.now();
        }

        function isLapsed(claim) {
            return claim.status === "held" && msLeft(claim) <= 0;
        }

        function createTile(x, y) {
            const tile = document.createElement("div");
            tile.dataset.x = x;
            tile.dataset.y = y;
            tile.id = `tile-${x}-${y}`;
            paintTile(tile, claims[`${x},${y}`]);
            tile.onclick = () => clickTile(x, y);
            return tile;
        }

        function updateTile(x, y) {
            const tile = document.getElementById(`tile-${x}-${y}`);
            if (tile) paintTile(tile, claims[`${x},${y}`]);
        }

        function paintTile(tile, claim) {
            tile.className = "tile";
            tile.style.backgroundColor = "white";
            tile.title = `(${tile.dataset.x}, ${tile.dataset.y})`;
            if (!claim || claim.status === "released") return;

            tile.classList.add("owned", claim.status);
            if (claim.owner === owner) tile.classList.add("mine");
            if (isLapsed(claim)) tile.classList.add("lapsed");
            tile.style.backgroundColor = claim.colour;
            tile.title += ` ${claim.status} by ${claim.owner}`;
        }

        function setClaim(claim) {
            claims[`${claim.x},${claim.y}`] = claim;
            updateTile(claim.x, claim.y);
            renderPanels();
        }

        function renderPanels() {
            const live = Object.values(claims).filter(c => c.status !== "released");
            const held = live.filter(c => c.status === "held").length;
            const stats = document.getElementById("stats");
            if (stats) stats.innerHTML = `
                <div class="stat"><span class="stat-dot claimed"></span><span>${live.length - held} confirmed</span></div>
                <div class="stat"><span class="stat-dot held"></span><span>${held} held</span></div>
                <div class="stat"><span class="stat-dot empty"></span><span>${10000 - live.length} free</span></div>
            `;

            const holds = document.getElementById("holds");
            if (!holds) return;
            const mine = live
                .filter(c => c.status === "held" && c.owner === owner)
                .sort((a, b) => new Date(a.expires_at) - new Date(b.expires_at));
            if (mine.length === 0) {
                holds.innerHTML = `<h3>Your holds</h3><p style="color:#999">None. Click an empty tile to hold it, then click it again to keep it.</p>`;
                return;
            }
            holds.innerHTML = `<h3>Your holds</h3>` + mine.map(c => {
                const left = msLeft(c);
                const time = left > 0
                    ? `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`
                    : "lapsed · awaiting sweep";
                const button = left > 0 ? `<button onclick="clickTile(${c.x}, ${c.y})">Confirm</button>` : "";
                return `<div class="hold-row">
                    <span class="swatch" style="background:${c.colour}"></span>
                    <span>(${c.x}, ${c.y})</span>
                    <span class="time">${time}</span>${button}
                </div>`;
            }).join("");
        }

        // Ticks the countdowns, and greys out holds the moment their deadline
        // passes. The tile only clears when the sweep's "released" event lands.
        setInterval(() => {
            Object.values(claims)
                .filter(c => c.status === "held")
                .forEach(c => updateTile(c.x, c.y));
            renderPanels();
        }, 1000);

        function clickTile(x, y) {
            if (!token) {
                showStatus("Not logged in", "error");
                return;
            }
            const claim = claims[`${x},${y}`];
            if (!claim || claim.status === "released") return claimTile(x, y);
            if (claim.owner !== owner) return showStatus(`(${x}, ${y}) is ${claim.status} by ${claim.owner}`, "error");
            if (claim.status === "confirmed") return showStatus(`(${x}, ${y}) is already yours`, "info");
            // Lapsed tiles still go to the server: it decides, and says 409.
            return confirmTile(claim);
        }

        async function claimTile(x, y) {
            const color = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
            const tile = document.getElementById(`tile-${x}-${y}`);
            tile?.classList.add("claiming");

            try {
                const resp = await fetch(`${CANVAS_API}/api/v1/claims/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ x, y, colour: color })
                });

                if (resp.status === 201) {
                    setClaim(await resp.json());
                    showStatus(`⏳ Holding (${x}, ${y}). Click it again to keep it.`, "success");
                } else if (resp.status === 409) {
                    showStatus("⚡ Someone claimed it first!", "error");
                    await loadCanvas();
                } else {
                    await handleError(resp);
                }
            } catch (e) {
                showStatus(`Error: ${e.message}`, "error");
            } finally {
                tile?.classList.remove("claiming");
            }
        }

        async function confirmTile(claim) {
            try {
                const resp = await fetch(`${CANVAS_API}/api/v1/claims/${claim.id}/confirm`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (resp.ok) {
                    setClaim(await resp.json());
                    const tile = document.getElementById(`tile-${claim.x}-${claim.y}`);
                    tile?.classList.add("just");
                    setTimeout(() => tile?.classList.remove("just"), 500);
                    showStatus(`🔒 (${claim.x}, ${claim.y}) is yours`, "success");
                } else if (resp.status === 409) {
                    showStatus("⌛ Too late, the hold lapsed", "error");
                } else {
                    await handleError(resp);
                }
            } catch (e) {
                showStatus(`Error: ${e.message}`, "error");
            }
        }

        async function handleError(resp) {
            if (resp.status === 401) {
                showStatus("Token expired", "error");
                return logout();
            }
            const errData = await resp.json().catch(() => ({}));
            showStatus(`Error: ${errData.detail || resp.statusText}`, "error");
        }

        function showStatus(msg, type = "info") {
            const statusEl = document.getElementById("status");
            statusEl.textContent = msg;
            statusEl.className = `status show ${type}`;
            setTimeout(() => statusEl.classList.remove("show"), 4000);
        }

        init();
    </script>
</body>
</html>
